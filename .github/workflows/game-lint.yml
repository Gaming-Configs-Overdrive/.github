name: Game lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: npm run ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [format:check, validate, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run "$SCRIPT"
        env:
          SCRIPT: ${{ matrix.script }}

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find YAML files
        id: files
        run: |
          find . \( -path ./node_modules -o -path ./.github -o -path ./.git \) -prune -o \
            -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 > "$RUNNER_TEMP/yaml-files"
          if [ -s "$RUNNER_TEMP/yaml-files" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "::notice::No YAML files, skipping yamllint"; fi
      - name: Run yamllint
        if: steps.files.outputs.found == 'true'
        run: |
          pipx install yamllint
          xargs -0 yamllint < "$RUNNER_TEMP/yaml-files"

  pyinilint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find INI files
        id: files
        run: |
          find . \( -path ./node_modules -o -path ./.git \) -prune -o -type f -name '*.ini' -print0 > "$RUNNER_TEMP/ini-files"
          if [ -s "$RUNNER_TEMP/ini-files" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "::notice::No INI files, skipping pyinilint"; fi
      - name: Run pyinilint
        if: steps.files.outputs.found == 'true'
        run: |
          pipx install pyinilint
          xargs -0 pyinilint < "$RUNNER_TEMP/ini-files"

  json:
    name: JSON syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse all JSON files
        run: |
          find . \( -path ./node_modules -o -path ./.git \) -prune -o \
            -type f -name '*.json' ! -name package-lock.json -print0 > "$RUNNER_TEMP/json-files"
          if [ ! -s "$RUNNER_TEMP/json-files" ]; then echo "::notice::No JSON files, skipping"; exit 0; fi
          # shellcheck disable=SC2016 # single-quoted JS is intentional
          node -e '
            const fs = require("fs");
            let failed = 0;
            for (const f of fs.readFileSync(process.argv[1], "utf8").split("\0").filter(Boolean)) {
              try { JSON.parse(fs.readFileSync(f, "utf8")); }
              catch (e) { failed++; console.log(`::error file=${f}::${e.message}`); }
            }
            process.exit(failed ? 1 : 0);
          ' "$RUNNER_TEMP/json-files"
