name: Game release

on:
  workflow_call:
    inputs:
      installer-ref:
        description: Ref (tag/branch/SHA) of Gaming-Configs-Overdrive/game-config-installer
        type: string
        default: v1
      include-installer:
        description: Add gco-install binaries and wrappers to the root of fullrelease.zip
        type: boolean
        default: true

permissions: {}

jobs:
  release:
    if: github.repository != 'Gaming-Configs-Overdrive/game-config-skeleton'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: game-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version and notes from CHANGELOG.md
        id: meta
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md not found"; exit 1
          fi
          VERSION=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$VERSION" ]; then
            echo "::error file=CHANGELOG.md::No '## [x.y.z]' heading found in CHANGELOG.md"; exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          rc=0; git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::notice::Tag $TAG already exists, nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          elif [ "$rc" -ne 2 ]; then
            echo "::error::git ls-remote failed (exit $rc)"; exit 1
          fi

          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::Section '## [$VERSION]' has no release notes"; exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.meta.outputs.skip == 'false'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build
        if: steps.meta.outputs.skip == 'false'
        run: |
          npm ci
          npm run build

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.meta.outputs.skip == 'false' && inputs.include-installer
        with:
          repository: Gaming-Configs-Overdrive/game-config-installer
          ref: ${{ inputs.installer-ref }}
          path: _installer
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.meta.outputs.skip == 'false' && inputs.include-installer
        with:
          go-version-file: _installer/go.mod
          cache: false

      - name: Build installer and add it to fullrelease.zip
        if: steps.meta.outputs.skip == 'false' && inputs.include-installer
        env:
          CGO_ENABLED: "0"
          # shortcut: main package path assumed; adjust if game-config-installer differs
          INSTALLER_PKG: ./cmd/gco-install
        run: |
          out="$RUNNER_TEMP/installer"
          mkdir -p "$out"
          (
            cd _installer
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$out/gco-install.exe" "$INSTALLER_PKG"
            GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$out/gco-install" "$INSTALLER_PKG"
          )
          cp _installer/wrappers/install.bat _installer/wrappers/install.sh "$out/"
          chmod +x "$out/gco-install" "$out/install.sh"
          zip -j dist/fullrelease.zip "$out/gco-install.exe" "$out/gco-install" "$out/install.bat" "$out/install.sh"

      - name: Regenerate SHA256SUMS
        if: steps.meta.outputs.skip == 'false'
        working-directory: dist
        run: |
          sha256sum ./*.zip MODS.md | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.meta.outputs.skip == 'false'
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create GitHub release
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.zip dist/MODS.md dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
